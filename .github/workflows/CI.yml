name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshots
  TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshots

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Xcode_26.0.1
      run: ls -l /Applications && sudo xcode-select -s /Applications/Xcode_26.0.1.app
    - name: Show ENV
      run: env
    - name: Build, test, and code coverage
      run: make
    - name: Archive test snapshot artifacts
      uses: actions/upload-artifact@v4
      with:
        name: snapshots
        path: ${{ env.SNAPSHOT_ARTIFACTS }}
    - name: Archive coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ github.workspace }}/coverage_iOS
    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_UPDATE }}
        gistID: 3489d8974ae6894967b2a43f657f9d70
        filename: SoundFontsPlus-coverage.json
        label: Coverage
        message: ${{ env.PERCENTAGE }}
        color: success
