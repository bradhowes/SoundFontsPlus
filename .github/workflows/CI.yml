name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshots
  TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshots

jobs:
  build:
    runs-on: xcode-27
    steps:
    - name: Clean Derived Data
      run: |
        rm -rf ~/Library/Developer/Xcode/DerivedData/*
        rm -rf .DerivedData-iOS
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode
      run: ls -l /Applications && sudo xcode-select -s /Applications/Xcode_27.2.app
    - name: Show simctl devices
      run: xcrun simctl list devices
    - name: Download iOS
      run: xcodebuild -downloadPlatform iOS
    - name: Start sim
      run: xcrun simctl boot 4DF1AA75-A2F8-4E1A-AF15-154F8671CBBC || echo "already booted"
    - name: Build, test, and code coverage
      run: make
    - name: Archive test snapshot artifacts
      uses: actions/upload-artifact@v4
      with:
        name: snapshots
        path: ${{ env.SNAPSHOT_ARTIFACTS }}
    - name: Archive coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ github.workspace }}/coverage_iOS
    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_UPDATE }}
        gistID: 3489d8974ae6894967b2a43f657f9d70
        filename: SoundFontsPlus-coverage.json
        label: Coverage
        message: ${{ env.PERCENTAGE }}
        color: success
